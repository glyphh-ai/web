# glyphh-web on Fly — the studio's site (glyphh.ai, and docs.glyphh.ai), behind Cloudflare.
#
# Deploys go through GitHub Actions (.github/workflows/deploy.yml) — never a
# local `fly deploy` push once the pipeline is live.

# Naming convention (Chris, 2026-08-03): Fly apps are <org-slug>-<folder> —
# glyphh-ai-web, mirroring the GitHub repo (glyphh-ai/web).
app = "glyphh-ai-web"
primary_region = "iad"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  # Marketing front door: keep one machine warm — no cold starts on first paint.
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[checks]
  [checks.http]
    type = "http"
    port = 3000
    path = "/"
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
