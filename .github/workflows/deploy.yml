name: Deploy glyphh-web

# The build runs HERE before any deploy, so a broken build fails with readable
# logs instead of inside a remote build. Deploys to Fly (glyphh-web.fly.dev, the
# origin behind Cloudflare). Heroku is retired; DNS cutover to Fly is pending.

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time, newest wins: two merges in a row once let the older
# image finish last and serve stale pages.
concurrency:
  group: deploy-glyphh-web
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build

  deploy-fly:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only
